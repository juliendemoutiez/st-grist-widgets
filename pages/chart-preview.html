<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphiques - prévisualisation (dev)</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .apercu__barre {
        display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
        padding: 8px 16px; background: #262625; color: #fff; font-size: 13px;
      }
      .apercu__barre strong { margin-right: 6px; }
      .apercu__barre button {
        padding: 4px 9px; font: inherit; font-size: 12px; cursor: pointer;
        background: #3a3a38; color: #fff; border: 1px solid #555; border-radius: 5px;
      }
      .apercu__barre button[aria-pressed='true'] { background: #3e5de7; border-color: #3e5de7; }
      .apercu__note { margin-left: auto; opacity: 0.65; }
      .apercu__erreur { padding: 24px; color: #b00; font-family: monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="apercu__barre" id="barre"><strong>Prévisualisation</strong></div>
    <div id="root"></div>

    <script type="module">
      /*
       * Harnais de développement : rejoue un widget hors de Grist, sur une copie
       * figée des données et une instance de configuration réelle. Page absente
       * du build — elle n'est pas déclarée dans vite.config.ts.
       */
      const INSTANCES = [
        'lst-offre3-produits-dashboard',
        'lst-offre3-parcours-dashboard',
        'lst-offre2-produits-dashboard',
        'lst-offre2-parcours-dashboard',
        'lst-offre3-produits-heatmap',
        'lst-offre3-produits-objectif',
        'lst-offre3-produits-evolution',
        'lst-offre3-parcours-heatmap',
        'lst-offre3-parcours-duree',
        'lst-offre3-parcours-evolution',
        'lst-offre2-produits-heatmap',
        'lst-offre2-produits-objectif',
        'lst-offre2-produits-evolution',
        'lst-offre2-parcours-heatmap',
        'lst-offre2-parcours-duree',
        'lst-offre2-parcours-evolution',
      ];

      // Le suffixe de l'instance désigne le type de widget à charger.
      const WIDGETS = {
        heatmap: () => import('/src/widgets/charts/heatmap/main.tsx'),
        objectif: () => import('/src/widgets/charts/objectif/main.tsx'),
        evolution: () => import('/src/widgets/charts/ligne/main.tsx'),
        duree: () => import('/src/widgets/charts/barres/main.tsx'),
        dashboard: () => import('/src/widgets/charts/dashboard/main.tsx'),
      };
      const typeDe = (nom) => nom.split('-').pop();

      const params = new URLSearchParams(location.search);
      const instance = params.get('instance') ?? INSTANCES[0];

      const barre = document.getElementById('barre');
      for (const nom of INSTANCES) {
        const b = document.createElement('button');
        b.textContent = nom.replace('lst-', '').replace(/-/g, ' ');
        b.setAttribute('aria-pressed', String(nom === instance));
        b.addEventListener('click', () => location.replace(`?instance=${nom}`));
        barre.appendChild(b);
      }
      const note = document.createElement('span');
      note.className = 'apercu__note';
      note.textContent = 'Données réelles figées ; objectifs de démonstration.';
      barre.appendChild(note);

      try {
        const [fixture, config] = await Promise.all([
          fetch('/lst-fixture.json').then((r) => r.json()),
          fetch(`/instances/${instance}.json`).then((r) => r.json()),
        ]);

        // La table Objectifs est vide en base ; on en fabrique pour voir les jauges.
        if (!fixture.Objectifs?.region) {
          const regions = [...new Set(fixture.Deploiements.region)].filter(Boolean).slice(0, 8);
          fixture.Objectifs = {
            id: regions.map((_, i) => i + 1),
            cle: regions.map((r) => `demo|${r}`),
            periode: regions.map(() => Math.floor(Date.UTC(2026, 6, 1) / 1000)),
            region: regions,
            offre: regions.map(() => 'OFFRE_3_DIRECT'),
            produit: regions.map(() => 'ESPACE_SUR_DEMANDE'),
            cible: regions.map((_, i) => 40 + i * 25),
          };
        }

        const noop = async () => {};
        window.grist = {
          ready: noop,
          // Le provider lit la configuration par ce canal : on lui sert l'instance.
          onOptions: (cb) => cb(config),
          onRecord: () => {},
          onRecords: () => {},
          docApi: {
            fetchTable: async (t) => {
              if (!fixture[t]) throw new Error(`table « ${t} » absente de la fixture`);
              return fixture[t];
            },
            applyUserActions: noop,
          },
          getTable: () => ({ getTableId: async () => config.table ?? 'Deploiements' }),
          selectedTable: { getTableId: async () => config.table ?? 'Deploiements' },
          setSelectedRows: noop,
          widgetApi: { getOption: async () => undefined, getOptions: async () => config, setOption: noop },
        };

        await WIDGETS[typeDe(instance)]();
      } catch (e) {
        document.getElementById('root').innerHTML =
          `<div class="apercu__erreur">${e.message}\n\nVérifiez que public/lst-fixture.json existe :\n  cd ../grist-deploiement && python3 scripts/export_fixture.py > ../grist-widgets/public/lst-fixture.json</div>`;
      }
    </script>
  </body>
</html>
